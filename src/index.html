<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolution of India</title>
<style>
  html, body { margin: 0; height: 100%; background: #05121f; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, 'DejaVu Sans', Arial, sans-serif; }
  #stage { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
  body.render #controls { display: none; }
  #controls { position: fixed; left: 16px; right: 16px; bottom: 12px; display: flex; gap: 12px; align-items: center;
    color: #cfe2f3; font-size: 13px; opacity: 0; transition: opacity .2s; }
  body:hover #controls { opacity: 1; }
  #controls button { background: #183b5a; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #scrub { flex: 1; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ocean" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1d5579"/>
      <stop offset="1" stop-color="#0b2740"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .07 0"/>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="camera">
    <rect x="-3000" y="-3000" width="7920" height="7080" fill="url(#ocean)"/>
    <rect x="-3000" y="-3000" width="7920" height="7080" fill="url(#grid)"/>
    <path id="land" fill="#e8dcc1" stroke="#c9b993" stroke-width="1.2"/>
    <path id="borders" fill="none" stroke="#a8977a" stroke-opacity=".55" stroke-width="1" stroke-dasharray="4 4"/>
    <g id="seaLabels" fill="#9cc3e0" fill-opacity=".55" font-style="italic" font-size="22" text-anchor="middle" letter-spacing="3"></g>
    <g id="others"></g>
    <g id="main" filter="url(#shadow)">
      <path id="mainShape" stroke-linejoin="round"/>
      <path id="mainExtraA" stroke-linejoin="round"/>
      <path id="mainExtraB" stroke-linejoin="round"/>
    </g>
    <path id="mainShine" fill="url(#shine)" pointer-events="none"/>
    <circle id="ripple" fill="none" stroke="#fff"/>
    <g id="faces"></g>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)" pointer-events="none"/>
  <rect width="1920" height="1080" filter="url(#grain)" pointer-events="none"/>

  <!-- HUD -->
  <g id="hud" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
    <g id="yearGroup" transform="translate(960 150)">
      <text id="year" text-anchor="middle" font-size="128" font-weight="900" fill="#fff"
            stroke="#0a1a2a" stroke-width="14" paint-order="stroke" letter-spacing="2">3000 BC</text>
    </g>
    <g id="nameGroup" transform="translate(960 228)">
      <rect id="namePill" rx="28" ry="28" height="56" y="-40"/>
      <text id="name" text-anchor="middle" font-size="36" font-weight="800" fill="#fff" letter-spacing="1"></text>
    </g>
    <g id="fiction" transform="translate(960 300)" opacity="0">
      <rect x="-190" y="-22" width="380" height="36" rx="18" fill="#000" fill-opacity=".45" stroke="#ffd75e" stroke-width="2"/>
      <text text-anchor="middle" y="4" font-size="18" font-weight="800" fill="#ffd75e" letter-spacing="3">FICTIONAL FUTURE</text>
    </g>
    <g id="timeline" transform="translate(260 1028)">
      <rect x="-40" y="-26" width="1480" height="52" rx="26" fill="#05121f" fill-opacity=".55"/>
      <rect x="0" y="-3" width="1400" height="6" rx="3" fill="#fff" fill-opacity=".18"/>
      <rect id="progress" x="0" y="-3" width="0" height="6" rx="3" fill="#ffd166"/>
      <g id="ticks"></g>
    </g>
  </g>
  <rect id="fade" width="1920" height="1080" fill="#05121f" pointer-events="none"/>
</svg>

<div id="controls">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="clock">0.0s</span>
</div>

<script src="./flubber.min.js"></script>
<script src="./geo-data.js"></script>
<script src="./animation.js"></script>
</body>
</html>
