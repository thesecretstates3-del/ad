const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return (h ^ (h >>> 16)) >>> 0; };

    if (y >= 118) c = (h % 29 === 0) ? '#E9DBBC' : '#F0E4CA';          // wainscot

  } else {
    const tx = Math.floor(x / 10), ty = Math.floor((y - FLOOR_Y) / 5);
    c = (tx + ty) % 2 === 0 ? '#EBDCBB' : '#F1E5C9';
    if ((y - FLOOR_Y) % 5 === 0 && (tx + ty) % 2 === 1) c = '#EBDCBB';

win(150, 20, 186, 70); for (let y = 21; y <= 69; y++) px(168, y, '#D9C7A0'); for (let x = 151; x <= 185; x++) px(x, 45, '#D9C7A0');

shadow(55, 160, 22, 3); shadow(130, 160, 24, 3);
// pixel panels
function panel(x0, y0, x1, y1) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = Math.min(x - x0, x1 - x), j = Math.min(y - y0, y1 - y);

    const border = i === 0 || j === 0 || (i < 2 && j < 2 && i + j === 2);
    px(x, y, border ? '#C9B387' : (y === y1 - 1 || x === x1 - 1) ? '#F2E8CF' : '#FBF6E8');

panel(195, 4, 315, 100); panel(195, 105, 315, 175);

const art = new Container(); app.stage.addChild(art);

const idle = createCharacter(app, { pose: 'idle', expression: 'neutral' });

  const head = c.parts.head; head.removeFromParent();
  const holder = new Container(); holder.scale.set(4); holder.position.set(cells[i][0], cells[i][1]);
  head.position.set(0, 0); holder.addChild(head); art.addChild(holder);
  const t = label(n, 26, 0x1E1B24, 2); t.anchor.set(0.5, 0); t.position.set(cells[i][0], cells[i][1] + 14); ui.addChild(t);
});

// ------------------------------------------------ exploded rig (x3) with pivot dots
const rig = createCharacter(app, { pose: 'idle', expression: 'neutral' });
explode(rig, 1);
rig.scale.set(3); rig.position.set(1690, 1008); art.addChild(rig);
const DOTS = ['hips', 'torso', 'head', 'hair_curl', 'collar', 'armL_upper', 'armL_lower', 'handL', 'armR_upper', 'armR_lower', 'handR',

  const p = rig.parts[n].getGlobalPosition(); const x = Math.round(p.x), y = Math.round(p.y);
  dots.circle(x, y, 4.5).fill(0xFF5D5D).stroke({ width: 2, color: 0x1E1B24 });
}
ui.addChild(dots);

}

const sub = label('OLI  /  CHARACTER STYLE SHEET  /  32-BIT PIXEL, 64x96 LOGICAL, x6', 18, 0x7A6748, 3, 'normal'); sub.position.set(52, 100); ui.addChild(sub);
const bar = new Graphics().rect(48, 128, 120, 6).fill(0x2EC4B6).rect(168, 128, 48, 6).fill(0xFF5D5D); ui.addChild(bar);
const l1 = label('IDLE', 26, 0x6B5B45, 6); l1.anchor.set(0.5, 0); l1.position.set(330, 1010); ui.addChild(l1);

const l3 = label('EXPRESSIONS', 16, 0x7A6748, 4); l3.position.set(1204, 32); ui.addChild(l3);
const l4 = label('RIG  /  PIVOTS', 20, 0x7A6748, 5); l4.position.set(1204, 646); ui.addChild(l4);

const legend = label('root [ground]\n  hips\n    legs: upper > lower > foot\n    torso\n      collar, pocket, strings, pin\n      arms: upper > lower > hand\n      head\n        hair_back, face, hair_front\n        face: eyes, brows, mouth, blush\n        hair_curl [top of head]\n\nred dot = pivot', 17, 0x6B5B45, 0, 'normal');
