<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VOXEL</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<style>
  html,body{margin:0;background:#F4EAD5}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#F4EAD5;
    font-family:"Trebuchet MS","Segoe UI","DejaVu Sans",sans-serif;color:#1E1B24}
  canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
  .card{position:absolute;border-radius:22px;background:rgba(255,250,238,.5);box-shadow:inset 0 0 0 2px rgba(120,90,50,.14)}
  .lab{position:absolute;font-size:16px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    background:#1E1B24;color:#FFF4DC;padding:6px 14px;border-radius:6px}
  .lab.teal{background:#2EC4B6;color:#1E1B24}
  .lab.coral{background:#FF5D5D;color:#1E1B24}
  #title{position:absolute;left:44px;top:24px;font-size:46px;font-weight:900;letter-spacing:.24em}
  #sub{position:absolute;left:47px;top:82px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
</style></head>
<body><div id="stage"></div>
<script type="module">
import * as THREE from 'three';
import { createCharacter, setPose, setExpression, buildVoxelMesh, Vox, h3, S, PALETTE as P } from './character.js';

const W = 1920, H = 1080;
const stage = document.getElementById('stage');
const el = (cls, html, x, y, w, h) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html;
  Object.assign(d.style, { left: x + 'px', top: y + 'px', ...(w ? { width: w + 'px', height: h + 'px' } : {}) }); stage.appendChild(d); return d; };
const R = { idle: [30, 118, 650, 930], point: [696, 118, 650, 930], happy: [1362, 118, 528, 452], scared: [1362, 596, 528, 452] };
for (const r of Object.values(R)) el('card', '', ...r);

const canvas = document.createElement('canvas'); stage.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;

function lights(scene, { size = 2048, target = [0, 1.0, 0], box = 2.4 } = {}) {
  scene.add(new THREE.HemisphereLight(0xfff2dc, 0xd7bf99, 1.35));
  const key = new THREE.DirectionalLight(0xffe6c4, 2.7);
  key.position.set(-2.2, 5, 3.6); key.target.position.set(...target);
  key.castShadow = true; key.shadow.mapSize.set(size, size);
  Object.assign(key.shadow.camera, { left: -box, right: box, top: box, bottom: -box, near: 1, far: 20 });
  key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
  scene.add(key, key.target);
  const fill = new THREE.DirectionalLight(0xd2e4ff, 0.9); fill.position.set(5, 2.5, 5); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffd7a6, 1.6); rim.position.set(3.5, 4, -5); rim.target.position.set(...target); scene.add(rim, rim.target);
}

// ---------- voxel scenery: floating slab of floor tiles with exposed soil layers, door, crate, plant
const woodA = 0x8a5a3c, woodB = 0x744a30;
function floorVox() {
  const v = new Vox();
  for (let x = -28; x <= 27; x++) for (let z = -20; z <= 19; z++) {
    const tile = ((Math.floor((x + 28) / 8) + Math.floor((z + 20) / 8)) & 1);
    const grout = ((x + 28) % 8 === 0) || ((z + 20) % 8 === 0);
    const jit = h3(x, 0, z, 5);
    let top = tile ? 0xeadcb9 : 0xf3e7cb; if (grout) top = 0xd9c79d; else if (jit < .08) top = tile ? 0xe3d3ac : 0xebdfc0;
    v.set(x, -1, z, top);
    v.set(x, -2, z, h3(x, -2, z, 6) < 0.3 ? 0xb89f73 : 0xc7b088);
    v.set(x, -3, z, h3(x, -3, z, 7) < 0.35 ? 0x7d5434 : 0x926541);
    if (h3(x, -4, z, 8) < 0.78) v.set(x, -4, z, h3(x, -4, z, 9) < 0.3 ? 0x6b4529 : 0x7d5434);
    if (h3(x, -5, z, 10) < 0.3 && h3(x, -4, z, 8) < 0.7) v.set(x, -5, z, 0x62402a);
  }
  // chip a few edge tiles for a hand-made look
  for (let x = -28; x <= 27; x++) for (const z of [-20, 19]) if (h3(x, z, 1, 3) < 0.12) { v.del(x, -1, z); }
  return v;
}
function doorVox(col, colS, x0, z0, facing = 1) {
  const v = new Vox();
  const w = 14, h = 34;
  v.box(x0, 0, z0, x0 + w - 1, h - 1, z0 + 2, (x, y, z) => (h3(x, y, z, 2) < .2 ? woodB : woodA));              // frame
  v.box(x0 + 2, 0, z0 + 1, x0 + w - 3, h - 3, z0 + 2, (x, y, z) => (h3(x, y, z, 4) < .12 ? colS : col));         // door leaf
  v.box(x0 + 4, 5, z0 + 3, x0 + w - 5, 14, z0 + 3, colS);                                                         // lower panel (raised)
  v.box(x0 + 4, 18, z0 + 3, x0 + w - 5, 27, z0 + 3, colS);
  v.box(x0 + 5, 6, z0 + 3, x0 + w - 6, 13, z0 + 3, col); v.box(x0 + 5, 19, z0 + 3, x0 + w - 6, 26, z0 + 3, col);
  v.box(x0 - 1, 0, z0 - 1, x0 + w, 1, z0 + 4, 0xc9b48a);                                                            // step
  const kx = facing > 0 ? x0 + w - 4 : x0 + 3;
  v.set(kx, 15, z0 + 4, P.cream); v.set(kx, 14, z0 + 4, P.cream);
  v.set(x0 + 6, 21, z0 + 4, P.ink); v.set(x0 + 7, 21, z0 + 4, P.ink);
  v.box(x0 + 6, 0, z0 + 4, x0 + 7, 0, z0 + 6, 0xfff0b8);                                                           // light leaking under the door
  return v;
}
function crateVox(x0, z0, n = 7) {
  const v = new Vox();
  v.box(x0, 0, z0, x0 + n - 1, n - 1, z0 + n - 1, (x, y, z) => {
    const edge = [x === x0 || x === x0 + n - 1, y === 0 || y === n - 1, z === z0 || z === z0 + n - 1].filter(Boolean).length >= 2;
    return edge ? 0x7a4c2f : (h3(x, y, z, 6) < .2 ? 0xb58156 : 0xc48f60);
  });
  return v;
}
function plantVox(x0, z0) {
  const v = new Vox();
  v.box(x0, 0, z0, x0 + 4, 4, z0 + 4, (x, y, z) => (y === 4 ? 0xff7a6f : 0xff5d5d));
  v.box(x0 + 1, 4, z0 + 1, x0 + 3, 4, z0 + 3, 0x6b4529);
  v.box(x0 + 2, 5, z0 + 2, x0 + 2, 9, z0 + 2, 0x4f9a52);
  for (const [dx, dz, y] of [[-1, 0, 8], [1, 0, 9], [0, -1, 7], [0, 1, 10], [-2, 0, 9], [2, 0, 10], [0, 2, 8], [-1, 1, 11], [1, -1, 11]])
    v.box(x0 + 2 + dx, y, z0 + 2 + dz, x0 + 2 + dx, y + 1, z0 + 2 + dz, h3(dx, y, dz, 3) < .4 ? 0x5db56a : 0x449a58);
  return v;
}
function addVox(scene, vox, extra = {}) { const m = buildVoxelMesh(vox, { ...extra }); scene.add(m); return m; }
const panels = [];
function panel(rect, setup, cam, light) {
  const scene = new THREE.Scene(); lights(scene, light);
  const [, , w, h] = rect;
  const camera = new THREE.PerspectiveCamera(cam.fov, w / h, 0.1, 100);
  const tgt = new THREE.Vector3(...cam.target), az = (cam.az || 0) * Math.PI / 180, e = cam.el * Math.PI / 180;
  const d = cam.vis / (2 * Math.tan(cam.fov * Math.PI / 360));
  camera.position.set(tgt.x + d * Math.cos(e) * Math.sin(az), tgt.y + d * Math.sin(e), tgt.z + d * Math.cos(e) * Math.cos(az));
  camera.lookAt(tgt); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
  setup(scene); panels.push({ rect, scene, camera });
}

panel(R.idle, (s) => {
  addVox(s, floorVox());
  addVox(s, doorVox(0x2ec4b6, 0x23a398, 11, -14));
  addVox(s, crateVox(-23, -9)); addVox(s, crateVox(-19, -13, 5)); addVox(s, plantVox(-24, 2));
  const c = createCharacter(); setPose(c, 'idle'); setExpression(c, 'neutral'); s.add(c);
}, { fov: 16, target: [0, 1.28, 0], vis: 3.9, el: 10, az: 5 }, { target: [0, 0.8, 0], box: 2.4 });

panel(R.point, (s) => {
  addVox(s, floorVox());
  addVox(s, doorVox(0x2ec4b6, 0x23a398, -25, -14, -1));   // option A (teal) — the one Oli points at
  addVox(s, doorVox(0xff5d5d, 0xd94848, 11, -14, 1));      // option B (coral)
  addVox(s, crateVox(17, 2, 6));
  const c = createCharacter(); setPose(c, 'point'); setExpression(c, 'happy'); s.add(c);
}, { fov: 16, target: [-0.1, 1.28, 0], vis: 3.9, el: 10, az: 0 }, { target: [0, 0.8, 0], box: 2.4 });

for (const [k, ex, yaw] of [['happy', 'happy', -0.16], ['scared', 'scared', 0.14]]) {
  panel(R[k], (s) => { const c = createCharacter(); setExpression(c, ex); c.rotation.y = yaw; s.add(c); },
    { fov: 14, target: [0, 1.75, 0], vis: 1.55, el: 2, az: 0 }, { size: 1024, target: [0, 1.7, 0], box: 1.6 });
}

el('lab', 'idle · front', R.idle[0] + 16, R.idle[1] + R.idle[3] - 48);
el('lab', 'point · 3/4', R.point[0] + 16, R.point[1] + R.point[3] - 48);
el('lab teal', 'happy', R.happy[0] + 16, R.happy[1] + R.happy[3] - 48);
el('lab coral', 'scared', R.scared[0] + 16, R.scared[1] + R.scared[3] - 48);
el('', 'VOXEL', 0, 0).id = 'title';
el('', 'Oli · voxel grid · merged geometry per rig part · baked AO', 0, 0).id = 'sub';
for (const id of ['title', 'sub']) document.getElementById(id).style.removeProperty('left');
document.getElementById('title').style.left = '44px'; document.getElementById('sub').style.left = '47px';
document.getElementById('title').style.top = '24px'; document.getElementById('sub').style.top = '82px';

renderer.setScissorTest(true);
for (const p of panels) {
  const [x, y, w, h] = p.rect;
  renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h);
  renderer.render(p.scene, p.camera);
}
window.__READY = true;
</script></body></html>
