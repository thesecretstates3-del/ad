<body><div id="stage"></div>
<script type="module">
import * as THREE from 'three';

const W = 1920, H = 1080;
const stage = document.getElementById('stage');

// ---------- the floating island
const SZ = 3.6, HALF = SZ / 2;

function props() {
  const g = new THREE.Group(); g.name = 'props';
  // cut-away brick walls (back corner)
  const wallC = 0xe6a98a, capC = 0xf6ead2, grooveC = 0xd18d70;
  const wz = -HALF + 0.27, wx = -HALF + 0.27;

  for (const y of [0.45, 0.95, 1.45, 1.95]) g.add(box(SZ - 0.24, 0.025, 0.31, grooveC, 0.02, y, wz + 0.002, { cast: false }));
  g.add(box(0.3, 1.0, 1.7, wallC, wx, 0.5, -0.8), box(0.36, 0.07, 1.7, capC, wx, 1.03, -0.8));
  g.add(box(SZ - 0.1, 0.12, 0.34, 0xc4876c, 0.0, 0.06, wz + 0.01, { cast: false }));

  g.add(box(0.07, 0.12, 0.02, 0x1e1b24, dx, 1.2, dz + 0.12, { cast: false }));
  g.add(box(0.62, 0.012, 0.35, 0xfff0b0, dx, 0.012, dz + 0.3, { cast: false, mat: glow(0xffe9a3) }));            // light under the door
  // lamp post
  const lx = -1.35, lz = 1.05;
  g.add(box(0.3, 0.12, 0.3, 0x3c3a4a, lx, 0.06, lz), box(0.2, 0.18, 0.2, 0x3c3a4a, lx, 0.21, lz));
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.065, 2.6, 6), M(0x3c3a4a)); pole.position.set(lx, 1.5, lz); pole.castShadow = true; g.add(pole);
  g.add(box(0.36, 0.06, 0.36, 0x3c3a4a, lx, 2.82, lz));
  g.add(box(0.28, 0.34, 0.28, 0xffd27a, lx, 3.02, lz, { cast: false, mat: glow(0xffd98a) }));
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.2, 4), M(0x3c3a4a)); cap.rotation.y = Math.PI / 4; cap.position.set(lx, 3.29, lz); cap.castShadow = true; g.add(cap);
  const pl = new THREE.PointLight(0xffc870, 2.2, 3.2, 2); pl.position.set(lx, 2.9, lz); g.add(pl);
  // bench against the wall
  const bx = -0.78, bz = wz + 0.46;
  for (let i = 0; i < 3; i++) g.add(box(1.0, 0.045, 0.1, 0xb27a52, bx, 0.38, bz - 0.1 + i * 0.1));
  g.add(box(1.0, 0.18, 0.04, 0xb27a52, bx, 0.72, bz - 0.17), box(1.0, 0.1, 0.04, 0xb27a52, bx, 0.58, bz - 0.17));
  for (const s of [-1, 1]) g.add(box(0.06, 0.4, 0.3, 0x3c3a4a, bx + s * 0.44, 0.2, bz), box(0.06, 0.38, 0.04, 0x3c3a4a, bx + s * 0.44, 0.58, bz - 0.17));
  // small shrub by the lamp
  for (const [x, z, r] of [[-1.45, 1.55, 0.22], [-1.15, 1.58, 0.16], [-1.55, 1.3, 0.14]]) { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), M(0x5db56a)); b.position.set(x, r * 0.8, z); b.castShadow = true; g.add(b); }

}
function clouds(scene) {
  const g = new THREE.Group();
  for (const [x, y, z, s] of [[-3.6, 2.6, -4.5, 1], [4.2, -1.2, 3.5, 0.8]]) {
    const c = new THREE.Group();
    for (const [ox, oy, r] of [[0, 0, .5], [.55, -.08, .4], [-.55, -.1, .38], [.15, .25, .35]]) c.add(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), M(0xffffff, { roughness: 1, transparent: true, opacity: 0.85 })));

const sTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 2, 64, 64, 62); gr.addColorStop(0, 'rgba(90,60,30,.34)'); gr.addColorStop(.6, 'rgba(90,60,30,.12)'); gr.addColorStop(1, 'rgba(90,60,30,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; })();

const panels = [];
function isoPanel(rect, setup, { fh, target, dir = [1, 1, 1], az = 0 }) {

  const aspect = w / h;
  const cam = new THREE.OrthographicCamera(-fh * aspect / 2, fh * aspect / 2, fh / 2, -fh / 2, 0.1, 100);

  const wrap = new THREE.Group(); wrap.position.set(0.1, 0.0, 0.5); wrap.rotation.y = Math.PI / 4; wrap.scale.setScalar(1.12); scene.add(wrap);
  const c = createCharacter(); setPose(c, pose); setExpression(c, pose === 'point' ? 'happy' : 'neutral'); wrap.add(c);
  // standing on the tile surface (y = 0.0)
  c.position.y = 0.0;
  return c;
}

isoPanel(R.idle, (s) => world(s, 'idle'), ISO);
isoPanel(R.point, (s) => world(s, 'point'), ISO);
for (const [k, ex, yaw] of [['happy', 'happy', 0.5], ['scared', 'scared', 0.5]]) {
  const rect = R[k], [, , w, h] = rect, scene = new THREE.Scene(); lights(scene, { size: 1024, box: 2, target: [0, 1.6, 0] });
  const c = createCharacter(); setExpression(c, ex); c.rotation.y = yaw; scene.add(c);
  const fh = 2.15, aspect = w / h;
  const cam = new THREE.OrthographicCamera(-fh * aspect / 2, fh * aspect / 2, fh / 2, -fh / 2, 0.1, 100);
  cam.position.set(2.6, 3.2, 6.5).add(new THREE.Vector3(0, 0, 0)); cam.lookAt(0, 1.75, 0); cam.position.y += 0; cam.updateProjectionMatrix(); cam.updateMatrixWorld();

}

el('lab', 'idle · iso front', R.idle[0] + 18, R.idle[1] + R.idle[3] - 50);
el('lab', 'point · "this one"', R.point[0] + 18, R.point[1] + R.point[3] - 50);
el('lab teal', 'happy', R.happy[0] + 18, R.happy[1] + R.happy[3] - 50);
el('lab coral', 'scared', R.scared[0] + 18, R.scared[1] + R.scared[3] - 50);
el('', 'ISOMETRIC DIORAMA', 0, 0).id = 'title'; el('', 'Oli · tiny floating street · flat low-poly · orthographic iso camera', 0, 0).id = 'sub';
document.getElementById('title').style.cssText = 'left:44px;top:22px'; document.getElementById('sub').style.cssText = 'left:47px;top:78px';

renderer.setScissorTest(true);
for (const p of panels) {
  const [x, y, w, h] = p.rect;
  renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h);
  renderer.render(p.scene, p.camera);
}
window.__READY = true;
