<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VINYL DESIGNER TOY</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<style>
  html,body{margin:0;background:#F4EAD5}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;
    background:linear-gradient(180deg,#F4EAD5 0%,#F1E5CC 55%,#E2D2B2 100%);
    font-family:"Trebuchet MS","Segoe UI","DejaVu Sans",sans-serif;color:#1E1B24}
  canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
  .card{position:absolute;border-radius:22px;background:linear-gradient(180deg,rgba(255,252,243,.7),rgba(255,248,232,.35));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8),0 10px 30px rgba(120,90,50,.12)}
  .lab{position:absolute;font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    background:#1E1B24;color:#FFF4DC;padding:6px 14px;border-radius:999px}
  .lab.teal{background:#2EC4B6;color:#1E1B24}
  #title{position:absolute;left:46px;top:24px;font-size:38px;font-weight:800;letter-spacing:.2em}
  #sub{position:absolute;left:48px;top:76px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
</style></head>
<body><div id="stage"></div>
<script type="module">
import * as THREE from 'three';
import { createCharacter, setPose, setExpression } from './character.js';

const W = 1920, H = 1080;
const stage = document.getElementById('stage');
const el = (cls, html, x, y, w, h) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html;
  Object.assign(d.style, { left: x + 'px', top: y + 'px', ...(w ? { width: w + 'px', height: h + 'px' } : {}) }); stage.appendChild(d); return d; };

const R = { idle: [30, 120, 610, 930], point: [660, 120, 610, 930], happy: [1290, 120, 600, 450], scared: [1290, 600, 600, 450] };
for (const r of [R.happy, R.scared]) el('card', '', ...r);

const canvas = document.createElement('canvas'); stage.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;

// ---------- studio environment: warm room + big softbox + strip light ----------
function studioEnv() {
  const s = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(24, 14, 24), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.62, 0.55, 0.44), side: THREE.BackSide }));
  room.position.y = 6; s.add(room);
  const light = (w, h, pos, v, tint = [1, 0.97, 0.9]) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(v * tint[0], v * tint[1], v * tint[2]), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 1.5, 0); s.add(m); };
  light(7, 5, [-6, 7, 8], 7);               // big softbox, upper left front
  light(1.6, 8, [9, 5, 3], 4, [0.9, 0.95, 1]); // cool strip right
  light(5, 2, [2, 11, -4], 3);              // top rim
  light(9, 9, [0, 12, 4], 1.4);             // overhead fill
  const g = new THREE.PMREMGenerator(renderer);
  const t = g.fromScene(s, 0.035).texture; g.dispose(); return t;
}
const env = studioEnv();

// soft blob contact shadow (under the base)
const cv = document.createElement('canvas'); cv.width = cv.height = 128;
{ const g = cv.getContext('2d'), gr = g.createRadialGradient(64, 64, 8, 64, 64, 62);
  gr.addColorStop(0, 'rgba(90,60,30,.55)'); gr.addColorStop(.6, 'rgba(90,60,30,.22)'); gr.addColorStop(1, 'rgba(90,60,30,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
const blobTex = new THREE.CanvasTexture(cv); blobTex.colorSpace = THREE.SRGBColorSpace;

function setup(scene, { target = [0, 1.2, 0], box = 3, ground = true } = {}) {
  scene.environment = env; scene.environmentIntensity = 1.0;
  const key = new THREE.DirectionalLight(0xfff0d8, 1.3);
  key.position.set(-4, 8, 6); key.target.position.set(...target);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -box, right: box, top: box, bottom: -box, near: 1, far: 25 });
  key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02; key.shadow.radius = 5;
  scene.add(key, key.target);
  if (ground) {
    const bl = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.7), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, toneMapped: false }));
    bl.rotation.x = -Math.PI / 2; bl.position.set(0.05, 0.002, 0.08); scene.add(bl);
  }
}
const panels = [];
function panel(rect, build, cam, sopts) {
  const scene = new THREE.Scene(); setup(scene, sopts);
  const [, , w, h] = rect;
  const camera = new THREE.PerspectiveCamera(cam.fov, w / h, 0.1, 100);
  const tgt = new THREE.Vector3(...cam.target), az = (cam.az || 0) * Math.PI / 180, e = cam.el * Math.PI / 180;
  const d = cam.vis / (2 * Math.tan(cam.fov * Math.PI / 360));
  camera.position.set(tgt.x + d * Math.cos(e) * Math.sin(az), tgt.y + d * Math.sin(e), tgt.z + d * Math.cos(e) * Math.cos(az));
  camera.lookAt(tgt); camera.updateMatrixWorld();
  build(scene); panels.push({ rect, scene, camera });
}

panel(R.idle, (s) => { const c = createCharacter(); setPose(c, 'idle'); s.add(c); },
  { fov: 16, target: [0, 1.4, 0], vis: 3.5, el: 10, az: 4 });
panel(R.point, (s) => { const c = createCharacter(); setPose(c, 'point'); setExpression(c, 'happy'); s.add(c); },
  { fov: 16, target: [0, 1.4, 0], vis: 3.55, el: 10, az: 0 });
panel(R.happy, (s) => { const c = createCharacter(); setExpression(c, 'happy'); c.rotation.y = -0.2; s.add(c); },
  { fov: 14, target: [0, 2.0, 0], vis: 2.2, el: 3, az: 0 }, { target: [0, 1.5, 0], box: 2.2, ground: false });
panel(R.scared, (s) => { const c = createCharacter(); setExpression(c, 'scared'); c.rotation.y = 0.18; s.add(c); },
  { fov: 14, target: [0, 2.0, 0], vis: 2.2, el: 3, az: 0 }, { target: [0, 1.5, 0], box: 2.2, ground: false });

el('', 'VINYL DESIGNER TOY', 0, 0).id = 'title';
el('', 'Oli · collectible figure · glossy clearcoat vinyl · display base', 0, 0).id = 'sub';
for (const id of ['title', 'sub']) document.getElementById(id).removeAttribute('style');
el('lab', 'idle', R.idle[0] + 18, R.idle[1] + R.idle[3] - 50);
el('lab', 'point · &ldquo;this one&rdquo;', R.point[0] + 18, R.point[1] + R.point[3] - 50);
el('lab teal', 'happy', R.happy[0] + 18, R.happy[1] + R.happy[3] - 46);
el('lab teal', 'scared', R.scared[0] + 18, R.scared[1] + R.scared[3] - 46);

renderer.setScissorTest(true);
setTimeout(() => {
  for (const p of panels) {
    const [x, y, w, h] = p.rect;
    renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h);
    renderer.render(p.scene, p.camera);
  }
  window.__READY = true;
}, 50);
</script></body></html>
