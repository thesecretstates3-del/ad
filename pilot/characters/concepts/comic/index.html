<!doctype html><html><head><meta charset="utf-8"><title>Oli — COMIC POP</title></head>
<body style="margin:0;background:#F4EAD5">
<script type="importmap">{"imports":{"pixi.js":"/node_modules/pixi.js/dist/pixi.mjs"}}</script>
<script type="module">
import { Application, Container, Graphics, Text } from 'pixi.js';
import { createCharacter, PALETTE as P } from './character.js';

const W = 1920, H = 1080, INK = P.ink;
const app = new Application();
await app.init({ width: W, height: H, background: P.bg, preference: 'webgl', antialias: true, resolution: 1 });
document.body.appendChild(app.canvas);
Object.assign(window, { app });
const S = app.stage;

let seed = 777;
const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const FONT = 'DejaVu Sans, Verdana, Arial, sans-serif';
const txt = (parent, s, size, x, y, o = {}) => {
  const t = new Text({ text: s, style: { fontFamily: FONT, fontSize: size, fontWeight: '900', fontStyle: o.italic === false ? 'normal' : 'italic',
    fill: o.fill || INK, letterSpacing: o.ls ?? 2, stroke: o.stroke ? { color: o.stroke, width: o.sw ?? 8, join: 'round' } : undefined } });
  t.anchor.set(o.ax ?? 0, o.ay ?? 0); t.position.set(x, y); t.rotation = o.rot || 0; parent.addChild(t); return t;
};

// halftone field helper: dot radius = f(x,y) over a rect
function dots(g, x0, y0, x1, y1, step, f, color) {
  for (let j = 0, y = y0; y < y1; y += step * 0.5, j++)
    for (let x = x0 + (j & 1) * step * 0.5; x < x1; x += step) { const r = f(x, y); if (r > 0.7) g.circle(x, y, r); }
  g.fill(color);
}
function rays(g, cx, cy, R, n, color, jitter = 0.35, start = 0) {
  for (let i = 0; i < n; i++) {
    const a = start + (i / n) * Math.PI * 2, w = (Math.PI / n) * (1 - jitter + rnd() * jitter * 2);
    g.moveTo(cx, cy).lineTo(cx + Math.cos(a - w) * R, cy + Math.sin(a - w) * R).lineTo(cx + Math.cos(a + w) * R, cy + Math.sin(a + w) * R).closePath();
  }
  g.fill(color);
}
function panel(x, y, w, h, drawBg, o = {}) {
  const c = new Container(); S.addChild(c);
  const sh = new Graphics().rect(x + 12, y + 14, w, h).fill(INK); c.addChild(sh);
  const base = new Graphics().rect(x, y, w, h).fill(o.base || '#FFF4DC'); c.addChild(base);
  const inner = new Container(); c.addChild(inner);
  const m = new Graphics().rect(x, y, w, h).fill(0xffffff); c.addChild(m); inner.mask = m;
  drawBg(inner);
  c.addChild(new Graphics().rect(x, y, w, h).stroke({ width: 10, color: INK, join: 'miter' }));
  return c;
}
const caption = (parent, s, x, y, o = {}) => {
  const t = txt(parent, s, o.size || 26, x + 18, y + 8, { ls: 5, ...o });
  const g = new Graphics().rect(x, y, t.width + 36, t.height + 14).fill(o.bg || '#FFD54A');
  g.rect(x, y, t.width + 36, t.height + 14).stroke({ width: 6, color: INK, join: 'miter' });
  const pad = new Graphics().rect(x + 8, y + 10, t.width + 36, t.height + 14).fill(INK);
  parent.addChildAt(pad, parent.getChildIndex(t)); parent.addChildAt(g, parent.getChildIndex(t));
  return g;
};

// ---------- page ----------
const page = new Graphics();
page.rect(0, 0, W, H).fill('#F4EAD5');
dots(page, 0, 0, W, H, 14, (x, y) => 2.1 - (y / H) * 0.6, '#EBDBB6');
S.addChild(page);

// ---------- title ----------
{
  const c = new Container(); S.addChild(c);
  c.addChild(new Graphics().rect(72, 62, 520, 112).fill(INK));
  c.addChild(new Graphics().rect(60, 48, 520, 112).fill('#FFD54A').rect(60, 48, 520, 112).stroke({ width: 8, color: INK, join: 'miter' }));
  const g = new Graphics(); dots(g, 60, 48, 580, 160, 11, (x, y) => Math.max(0, 3.4 - (x - 60) / 130), '#F2B33D'); c.addChild(g);
  txt(c, 'COMIC POP', 70, 70, 56, { fill: INK, ls: 3 });
  const cap = new Container(); S.addChild(cap);
  caption(cap, 'OLI  ·  WHAT IF…?  ·  CHARACTER SHEET', 60, 178, { size: 18, bg: '#FFFFFF', ls: 3 });
}

// top-right filler: halftone fade band + sparkle bursts
{
  const c = new Container(); S.addChild(c);
  const g = new Graphics(); dots(g, 660, 44, 1880, 214, 15, (x, y) => Math.max(0, (x - 660) / 300) * (3.9 - Math.abs(y - 130) / 26), '#FF8C78'); c.addChild(g);
  const star = (cx, cy, r, fill) => { const pts = []; for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; pts.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    c.addChild(new Graphics().poly(pts.map((v) => v + 6)).fill(INK)); c.addChild(new Graphics().poly(pts).fill(fill).stroke({ width: 6, color: INK, join: 'miter' })); };
  star(1480, 110, 70, '#FFD54A'); star(1640, 150, 40, '#2EC4B6'); star(1790, 96, 52, '#FF5D5D'); star(1330, 160, 30, '#FFFFFF');
}

// ---------- panels ----------
const PY = 236, PH = 790;
// idle: teal halftone with speed lines
panel(60, PY, 480, PH, (c) => {
  const g = new Graphics().rect(60, PY, 480, PH).fill('#B7ECE4'); c.addChild(g);
  const l = new Graphics(); rays(l, 300, 520, 1200, 44, '#8ADCD0', 0.5); c.addChild(l);
  const d = new Graphics(); dots(d, 60, PY, 540, PY + PH, 16, (x, y) => Math.max(0, (y - (PY + 380)) / 100), '#2EC4B6'); c.addChild(d);
});
// point: coral burst
panel(560, PY, 620, PH, (c) => {
  const g = new Graphics().rect(560, PY, 620, PH).fill('#FFD0BE'); c.addChild(g);
  const l = new Graphics(); rays(l, 800, 640, 1300, 22, '#FF8C78', 0.2, 0.1); c.addChild(l);
  const d = new Graphics(); dots(d, 560, PY, 1180, PY + 260, 16, (x, y) => Math.max(0, 4.5 - (y - PY) / 45), '#FF5D5D'); c.addChild(d);
});
// expression panels
const EXP = [
  { n: 'happy', x: 1200, y: PY, w: 330, h: 470, bg: '#FFD54A', ray: '#FFE88F', dot: '#F2B33D', cap: 'HAPPY' },
  { n: 'scared', x: 1560, y: PY, w: 330, h: 470, bg: '#26305A', ray: '#3A4A86', dot: '#FF5D5D', cap: 'SCARED' },
];
for (const e of EXP) {
  panel(e.x, e.y, e.w, e.h, (c) => {
    c.addChild(new Graphics().rect(e.x, e.y, e.w, e.h).fill(e.bg));
    const l = new Graphics(); rays(l, e.x + e.w / 2, e.y + 250, 900, e.n === 'happy' ? 26 : 34, e.ray, e.n === 'happy' ? 0.3 : 0.6); c.addChild(l);
    const d = new Graphics(); dots(d, e.x, e.y, e.x + e.w, e.y + e.h, 15, (x, y) => Math.max(0, 4.2 - (e.y + e.h - y) / 40), e.dot); c.addChild(d);
  });
}
// bottom-right: WHAT IF burst panel
panel(1200, PY + 510, 690, PH - 510, (c) => {
  const x = 1200, y = PY + 510, w = 690, h = PH - 510;
  c.addChild(new Graphics().rect(x, y, w, h).fill('#2EC4B6'));
  const l = new Graphics(); rays(l, x + w / 2, y + h / 2, 800, 28, '#6FDDD0', 0.45); c.addChild(l);
  const d = new Graphics(); dots(d, x, y, x + w, y + h, 14, (xx, yy) => Math.max(0, 3.6 - Math.abs(xx - (x + w / 2)) / 90 + 0.4 * Math.sin(yy)), '#1FA89B'); c.addChild(d);
  // starburst
  const sb = new Graphics(); const cx = x + w / 2, cy = y + h / 2, pts = [];
  for (let i = 0; i < 28; i++) { const a = (i / 28) * Math.PI * 2, r = i % 2 ? 128 : 178 + rnd() * 18; pts.push(cx + Math.cos(a) * r * 1.5, cy + Math.sin(a) * r * 0.72); }
  sb.poly(pts).fill('#FFD54A').stroke({ width: 8, color: INK, join: 'miter' });
  c.addChild(new Graphics().poly(pts.map((v, i) => v + (i & 1 ? 8 : 8))).fill(INK), sb);
  txt(c, 'WHAT IF…?', 60, cx, cy, { ax: 0.5, ay: 0.5, rot: -0.07, fill: '#FF5D5D', stroke: INK, sw: 12, ls: 2 });
});

// ---------- characters ----------
function place(ch, cx, groundY, targetH) {
  const b = ch.parts.hips.getLocalBounds();
  const s = targetH / (b.maxY - b.minY);
  ch.root.scale.set(s); ch.root.position.set(cx, groundY);
  S.addChild(ch.root); return s;
}
const idle = createCharacter(app, { pose: 'idle', expression: 'neutral' });
place(idle, 300, 985, 640);
const pt = createCharacter(app, { pose: 'point', expression: 'happy' });
place(pt, 760, 985, 610);

// pose captions (comic caption boxes)
{ const c = new Container(); S.addChild(c); caption(c, 'IDLE', 60, PY + 8, { size: 24 }); }
{ const c = new Container(); S.addChild(c); caption(c, 'POINT  ·  “I CHOOSE THIS ONE”', 560, PY + 8, { size: 22 }); }

// speech bubble from the point pose
{
  const c = new Container(); S.addChild(c);
  const bx = 1000, by = 400, rx = 135, ry = 70;
  const tail = [bx - 70, by + ry - 12, bx - 128, by + ry + 70, bx - 20, by + ry - 4];
  c.addChild(new Graphics().ellipse(bx + 8, by + 9, rx, ry).fill(INK));
  c.addChild(new Graphics().ellipse(bx, by, rx, ry).fill('#FFFFFF').ellipse(bx, by, rx, ry).stroke({ width: 7, color: INK }));
  c.addChild(new Graphics().poly(tail).fill('#FFFFFF').poly(tail).stroke({ width: 7, color: INK, join: 'miter' }));
  c.addChild(new Graphics().ellipse(bx - 62, by + ry - 8, 44, 8).fill('#FFFFFF'));
  txt(c, 'THIS ONE!', 40, bx, by, { ax: 0.5, ay: 0.5, ls: 2 });
}

// expression close-ups
for (const e of EXP) {
  const ch = createCharacter(app, { pose: 'idle', expression: e.n, shadow: false });
  const head = ch.parts.head; head.parent.removeChild(head);
  head.position.set(0, 0); head.rotation = 0;
  const b = head.getLocalBounds();
  const s = Math.min((e.w - 30) / (b.maxX - b.minX), (e.h - 100) / (b.maxY - b.minY));
  head.scale.set(s);
  head.position.set(e.x + e.w / 2 - ((b.minX + b.maxX) / 2) * s, e.y + 52 - b.minY * s + (e.h - 100 - (b.maxY - b.minY) * s) / 2);
  S.addChild(head);
  const c = new Container(); S.addChild(c);
  caption(c, e.cap, e.x - 6, e.y + e.h - 26, { size: 28, bg: e.n === 'happy' ? '#FFFFFF' : '#FF5D5D', fill: e.n === 'happy' ? INK : '#FFFFFF', stroke: e.n === 'happy' ? undefined : INK, sw: 5 });
}

// page border
S.addChild(new Graphics().rect(22, 22, W - 44, H - 44).stroke({ width: 10, color: INK, join: 'miter' }));

app.render();
window.__READY = true;
</script></body></html>
